[project]
name = "redscore"
version = "0.1.0"
description = "RedScore: benchmark redflow generation (GEN vs ground-truth redflow)"
requires-python = ">=3.10"   # the LangSmith SDK needs 3.10+; the venv runs 3.12 (.python-version)
dependencies = ["pyyaml>=6", "openai>=1.0", "langsmith>=0.14"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
redscore = "redscore.cli:main"

[tool.setuptools]
packages = ["redscore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
