[project]
name = "redscore"
version = "0.1.0"
description = "RedScore: benchmark redflow generation (GEN vs ground-truth redflow)"
requires-python = ">=3.9"
dependencies = ["pyyaml>=6", "openai>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
redscore = "redscore.cli:main"

[tool.setuptools]
packages = ["redscore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
